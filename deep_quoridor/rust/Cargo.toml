[profile.dev]
# Makes it easier to catch test failures in a debugger
panic = "abort"

[package]
name = "quoridor-rs"
version = "0.1.0"
edition = "2024"

[lib]
name = "quoridor_rs"
# Only `rlib` is listed so `cargo test` doesn't emit a `.so` alongside the
# `.rlib` and trigger cargo's "output filename collision" warning (cargo
# issue #6313, surfaces when one target has multiple crate-types and the
# binaries depend on the same lib). The python wheel build sets
# `crate-type = ["cdylib"]` via `[tool.maturin]` in pyproject.toml.
crate-type = ["rlib"]

[[bin]]
name = "create_policy_db"
path = "src/bin/create_policy_db.rs"
required-features = ["binary"]

[[bin]]
name = "selfplay"
path = "src/bin/selfplay.rs"
required-features = ["binary"]

[[bin]]
name = "play_server"
path = "src/bin/play_server.rs"
required-features = ["binary"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"], optional = true }
numpy = { version = "0.22", optional = true }
ndarray = "0.16"
rand = "0.8"
dashmap = { version = "6", optional = true }
rayon = { version = "1.10", optional = true }
arrow = { version = "53", optional = true }
parquet = { version = "53", default-features = false, features = ["arrow", "zstd"], optional = true }
serde = { version = "1", features = ["derive"] }
clap = { version = "4.5", features = ["derive"], optional = true }
# Pinned exactly: ort is pre-release and makes breaking API changes between
# rc.N versions. Cargo.lock is gitignored, so without an exact pin CI resolves a
# different rc than local checkouts (rc.11 vs rc.12 diverged the builder error
# types and broke the build).
ort = { version = "=2.0.0-rc.12", optional = true }
anyhow = "1"
serde_yaml = { version = "0.9", optional = true }
serde_json = { version = "1", optional = true }
tiny_http = { version = "0.12", optional = true }
ndarray-npy = { version = "0.9", optional = true }
zip = { version = "2", optional = true, default-features = false, features = ["deflate"] }
rand_distr = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"], optional = true }
futures = { version = "0.3", optional = true }
smallvec = "1.13"

[features]
default = ["python"]
python = ["pyo3", "numpy", "policy_db", "parallel"]
binary = ["clap", "ort", "serde_yaml", "serde_json", "ndarray-npy", "zip", "tokio", "futures", "tiny_http", "policy_db", "parallel"]
gpu = ["binary", "ort/cuda", "ort/load-dynamic"]
policy_db = ["dep:arrow", "dep:parquet", "dep:dashmap"]
parallel = ["dep:rayon", "dep:dashmap"]

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }
ureq = { version = "2", default-features = false, features = ["json"] }
# Mirrored from optional `binary`-feature deps so integration tests can name
# these types directly (Cargo resolves a separate copy per target otherwise).
tiny_http = "0.12"
serde_json = "1"

[profile.release]
# Enable optimizations for better performance
opt-level = 3
lto = true
codegen-units = 1

[workspace]
members = ["quoridor-wasm"]
# `cargo build`/`cargo test` at the root operate on quoridor-rs only; the wasm
# crate is built explicitly via wasm-pack (it targets wasm32).
default-members = ["."]
